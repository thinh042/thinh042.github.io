<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="dreamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8fa" stop-opacity="1" />
      <stop offset="45%" stop-color="#8f65e2" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee8fa" />
      <stop offset="100%" stop-color="#b8a9e8" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#090d1e" stroke="#252d4a" stroke-width="2"/>
  <!-- Glowing Dreamcore Orb -->
  <circle cx="32" cy="32" r="22" fill="url(#dreamGlow)"/>
  <!-- Orbital Ellipse Rings -->
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-25 32 32)" stroke-dasharray="2 3"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#7ee8fa" stroke-width="1.2" transform="rotate(35 32 32)" opacity="0.6"/>
  <!-- Core Spark -->
  <circle cx="32" cy="32" r="6" fill="#ffffff" opacity="0.95"/>
  <circle cx="32" cy="32" r="9" fill="#7ee8fa" opacity="0.4"/>
</svg>
